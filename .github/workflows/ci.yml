name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          python -m ruff check --no-cache support_ticket_rag tests app.py
          python -m ruff format --check --no-cache support_ticket_rag tests app.py
      - name: Build Linux image
        run: docker compose build
      - name: Run mocked tests without model downloads or inference
        run: docker compose run --rm --no-deps api python -m unittest discover -s tests -v
